<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKURA Bar - Kiểm Kho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .category-header { position: sticky; top: 0; background: #f8fafc; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 p-3 font-sans pb-28">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-4">
        <!-- HEADER -->
        <div class="border-b pb-3 mb-4 text-center">
            <h1 class="text-xl font-bold text-red-600 tracking-wide">🍷 IKURA BAR - BESTELLLISTE</h1>
            <p class="text-xs text-gray-500 mt-1" id="datetime"></p>
        </div>

        <form id="inventoryForm" class="space-y-6">
            
            <!-- 1. KELLNER / SERVICE -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-red-700 text-sm mb-2 uppercase tracking-wide">🧑‍🍳 KELLNER / SERVICE</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Servietten</span> <input type="checkbox" name="item" value="Servietten" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kerzen</span> <input type="checkbox" name="item" value="Kerzen" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Toilette Papier</span> <input type="checkbox" name="item" value="Toilette Papier" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Bierdeckeln für Veranstaltung</span> <input type="checkbox" name="item" value="Bierdeckeln für Veranstaltung" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Servietten für Veranstaltung</span> <input type="checkbox" name="item" value="Servietten für Veranstaltung" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 2. TEE & GETRÄNKE BASIS -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-amber-800 text-sm mb-2 uppercase tracking-wide">☕ TEE & GETRÄNKE BASIS</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">T1. Trà Dưỡng Nhan 7 Vị (VN)</span> <input type="checkbox" name="item" value="T1. Trà Dưỡng Nhan 7 Vị (VN)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">T2. Trà Cam Quế Hoa Hồng (VN)</span> <input type="checkbox" name="item" value="T2. Trà Cam Quế Hoa Hồng (VN)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">T3. Trà Dưỡng Tâm 5 Vị (VN)</span> <input type="checkbox" name="item" value="T3. Trà Dưỡng Tâm 5 Vị (VN)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">G7 Kaffee Pulver (Asia Markt)</span> <input type="checkbox" name="item" value="G7 Kaffee Pulver (Asia Markt)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Matcha Pulver Cozy (Asia Markt)</span> <input type="checkbox" name="item" value="Matcha Pulver Cozy (Asia Markt)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Trà Chanh Hương Nhài Cozy</span> <input type="checkbox" name="item" value="Trà Chanh Hương Nhài Cozy (Asia)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Ingwer Tee (Kaufland)</span> <input type="checkbox" name="item" value="Ingwer Tee (Kaufland)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Schokolade Pulver</span> <input type="checkbox" name="item" value="Schokolade Pulver" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Teebeutel für Losen Tee</span> <input type="checkbox" name="item" value="Teebeutel für Losen Tee" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 3. MILCH & SAHNE -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-blue-700 text-sm mb-2 uppercase tracking-wide">🥛 MILCH & SAHNE</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Milch Laktosefrei 3,5%</span> <input type="checkbox" name="item" value="Milch Laktosefrei 3,5%" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kaffeesahne</span> <input type="checkbox" name="item" value="Kaffeesahne" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kondensmilch</span> <input type="checkbox" name="item" value="Kondensmilch" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Schlagsahne (Schlagfix)</span> <input type="checkbox" name="item" value="Schlagsahne (Schlagfix)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Sprühsahne</span> <input type="checkbox" name="item" value="Sprühsahne" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kokosmilch</span> <input type="checkbox" name="item" value="Kokosmilch" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Zuckersticks</span> <input type="checkbox" name="item" value="Zuckersticks" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 4. SIRUP & SOSSEN -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-amber-600 text-sm mb-2 uppercase tracking-wide">🍯 SIRUP & SOSSEN</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Schokolade Soße</span> <input type="checkbox" name="item" value="Schokolade Soße" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Erdbeer Sirup (Monin)</span> <input type="checkbox" name="item" value="Erdbeer Sirup (Monin)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Rose Sirup (Monin)</span> <input type="checkbox" name="item" value="Rose Sirup (Monin)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Blue Curacao Sirup (Monin)</span> <input type="checkbox" name="item" value="Blue Curacao Sirup (Monin)" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 5. FRÜCHTE & PÜREE -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-pink-600 text-sm mb-2 uppercase tracking-wide">🍓 FRÜCHTE & PÜREE</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Erdbeer Püree</span> <input type="checkbox" name="item" value="Erdbeer Püree" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mango Püree</span> <input type="checkbox" name="item" value="Mango Püree" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Litschi (geschält)</span> <input type="checkbox" name="item" value="Litschi (geschält)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Limetten</span> <input type="checkbox" name="item" value="Limetten" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Orange</span> <input type="checkbox" name="item" value="Orange" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Minze</span> <input type="checkbox" name="item" value="Minze" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 6. KRÄUTER & SAFT -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-green-700 text-sm mb-2 uppercase tracking-wide">🌿 KRÄUTER & SAFT</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Zitronengras</span> <input type="checkbox" name="item" value="Zitronengras" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Rosenblätter (getrocknet)</span> <input type="checkbox" name="item" value="Rosenblätter (getrocknet)" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Limettensaft</span> <input type="checkbox" name="item" value="Limettensaft" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Chanh Muối (Yuzu)</span> <input type="checkbox" name="item" value="Chanh Muối (Yuzu)" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 7. ALKOHOL -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-purple-700 text-sm mb-2 uppercase tracking-wide">🍷 ALKOHOL</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Choya Pflaumenwein</span> <input type="checkbox" name="item" value="Choya Pflaumenwein" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Choya Reiswein</span> <input type="checkbox" name="item" value="Choya Reiswein" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Wodka</span> <input type="checkbox" name="item" value="Wodka" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Jägermeister</span> <input type="checkbox" name="item" value="Jägermeister" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Tequila</span> <input type="checkbox" name="item" value="Tequila" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Jim Beam</span> <input type="checkbox" name="item" value="Jim Beam" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 8. DESSERT -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-cyan-700 text-sm mb-2 uppercase tracking-wide">🍨 DESSERT</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mochi Eis - Matcha</span> <input type="checkbox" name="item" value="Mochi Eis - Matcha" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mochi Eis - Mango</span> <input type="checkbox" name="item" value="Mochi Eis - Mango" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mochi Eis - Vanille</span> <input type="checkbox" name="item" value="Mochi Eis - Vanille" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mochi Eis - Schoko</span> <input type="checkbox" name="item" value="Mochi Eis - Schoko" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mochi Eis - Erdbeer</span> <input type="checkbox" name="item" value="Mochi Eis - Erdbeer" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mochi Eis - Kokos</span> <input type="checkbox" name="item" value="Mochi Eis - Kokos" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Vanille Eis</span> <input type="checkbox" name="item" value="Vanille Eis" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 9. BOBOQ - SIRUP -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-purple-800 text-sm mb-2 uppercase tracking-wide">🧋 BOBOQ - SIRUP</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Erdbeer</span> <input type="checkbox" name="item" value="BOBOQ Sirup - Erdbeer" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Mango</span> <input type="checkbox" name="item" value="BOBOQ Sirup - Mango" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Pfirsich</span> <input type="checkbox" name="item" value="BOBOQ Sirup - Pfirsich" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Litschi</span> <input type="checkbox" name="item" value="BOBOQ Sirup - Litschi" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Honigmelone</span> <input type="checkbox" name="item" value="BOBOQ Sirup - Honigmelone" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Brauner Zucker</span> <input type="checkbox" name="item" value="BOBOQ Sirup - Brauner Zucker" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 10. BOBOQ - TOPPING -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-teal-700 text-sm mb-2 uppercase tracking-wide">🧋 BOBOQ - TOPPING</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kristallkugel Litschi</span> <input type="checkbox" name="item" value="Kristallkugel Litschi" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kristallkugel Erdbeer</span> <input type="checkbox" name="item" value="Kristallkugel Erdbeer" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kristallkugel Mango</span> <input type="checkbox" name="item" value="Kristallkugel Mango" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kristallkugel Pfirsich</span> <input type="checkbox" name="item" value="Kristallkugel Pfirsich" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kristall Brauner Zucker</span> <input type="checkbox" name="item" value="Kristall Brauner Zucker" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Tapioka</span> <input type="checkbox" name="item" value="Tapioka" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 11. BOBOQ - MIXING -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-indigo-700 text-sm mb-2 uppercase tracking-wide">🧋 BOBOQ - MIXING</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Kaffeeweiser</span> <input type="checkbox" name="item" value="Kaffeeweiser" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Fructose</span> <input type="checkbox" name="item" value="Fructose" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Passionsfrucht Püree</span> <input type="checkbox" name="item" value="Passionsfrucht Püree" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Geröstete Oolong-Tee</span> <input type="checkbox" name="item" value="Geröstete Oolong-Tee" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Jasmin Grüner-Tee</span> <input type="checkbox" name="item" value="Jasmin Grüner-Tee" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Earl-Grey-Tee</span> <input type="checkbox" name="item" value="Earl-Grey-Tee" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- 12. VERPACKUNG -->
            <div class="border rounded-lg p-3 bg-gray-50">
                <h2 class="font-bold text-gray-700 text-sm mb-2 uppercase tracking-wide">📦 VERPACKUNG</h2>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">700ml Becher</span> <input type="checkbox" name="item" value="700ml Becher" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">500ml Becher</span> <input type="checkbox" name="item" value="500ml Becher" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Becher Deckel</span> <input type="checkbox" name="item" value="Becher Deckel" class="w-5 h-5 accent-red-600"></label>
                    <label class="flex items-center justify-between p-1 bg-white rounded border"><span class="font-medium">Strohhalme 1</span> <input type="checkbox" name="item" value="Strohhalme 1" class="w-5 h-5 accent-red-600"></label>
                </div>
            </div>

            <!-- NÚT BẤM CỐ ĐỊNH PHÍA DƯỚI -->
            <div class="fixed bottom-0 left-0 right-0 p-3 bg-white border-t shadow-lg flex gap-2 max-w-md mx-auto z-50">
                <button type="button" onclick="generateOrder()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg text-sm tracking-wide shadow transition">📋 TẠO DANH SÁCH MÓN THIẾU</button>
            </div>
        </form>

        <!-- KẾT QUẢ HIỂN THỊ -->
        <div id="result" class="hidden mt-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <h3 class="font-bold text-sm text-gray-800 mb-2">📋 BESTELLLISTE GỬI NHÀ CUNG CẤP:</h3>
            <textarea id="orderText" class="w-full h-44 text-xs font-mono p-3 border rounded-lg bg-white shadow-inner focus:outline-none" readonly></textarea>
            <button onclick="copyText()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-xs tracking-wide shadow mt-2 transition">📋 COPY DANH SÁCH</button>
        </div>
    </div>

    <script>
        document.getElementById('datetime').innerText = "Thời gian kiểm: " + new Date().toLocaleString('de-DE');

        function generateOrder() {
            const checkboxes = document.querySelectorAll('input[name="item"]:checked');
            if (checkboxes.length === 0) {
                alert('Vui lòng tích chọn ít nhất 1 mặt hàng thiếu!');
                return;
            }
            let text = "🧾 BESTELLLISTE IKURA BAR - " + new Date().toLocaleDateString('de-DE') + "\n";
            text += "-----------------------------------\n";
            checkboxes.forEach(cb => {
                text += "• " + cb.value + "\n";
            });
            document.getElementById('orderText').value = text;
            document.getElementById('result').classList.remove('hidden');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function copyText() {
            const text = document.getElementById('orderText');
            text.select();
            document.execCommand('copy');
            alert('Đã copy danh sách thành công! Anh có thể dán (paste) gửi qua Zalo / WhatsApp ngay.');
        }
    </script>
</body>
</html>
