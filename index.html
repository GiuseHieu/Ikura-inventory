            { id: 'f49', dept: 'Küche', name: 'Löffel 18cm (Muỗng nhựa)', category: 'Verpackung Bếp', unit: 'Packung', soll: 2, current: 2, supplier: 'Selgros' },
            { id: 'f50', dept: 'Küche', name: 'Frischhaltefolie (Màng bọc)', category: 'Verpackung Bếp', unit: 'Rolle', soll: 2, current: 2, supplier: 'Selgros' },
            { id: 'f51', dept: 'Küche', name: 'Sushi Box klein', category: 'Verpackung Bếp', unit: 'Karton', soll: 3, current: 3, supplier: 'Asia Import' },
            { id: 'f52', dept: 'Küche', name: 'Sushi Box groß', category: 'Verpackung Bếp', unit: 'Karton', soll: 3, current: 3, supplier: 'Asia Import' },
            { id: 'f53', dept: 'Küche', name: 'Suppenbecher (Ly súp)', category: 'Verpackung Bếp', unit: 'Karton', soll: 3, current: 3, supplier: 'Asia Import' },
            { id: 'f54', dept: 'Küche', name: 'Sojasaucen Becher (Hộp sốt)', category: 'Verpackung Bếp', unit: 'Karton', soll: 3, current: 3, supplier: 'Asia Import' },
            { id: 'f55', dept: 'Küche', name: 'Stäbchen (Đũa)', category: 'Verpackung Bếp', unit: 'Karton', soll: 4, current: 4, supplier: 'Asia Import' },
            { id: 'f56', dept: 'Küche', name: 'Tragetaschen (Túi mang đi)', category: 'Verpackung Bếp', unit: 'Karton', soll: 3, current: 3, supplier: 'Asia Import' },
            { id: 'f57', dept: 'Küche', name: 'FIT Spülmittel (Nước rửa chén)', category: 'Hygiene', unit: 'Flasche', soll: 4, current: 4, supplier: 'Selgros' },
            { id: 'f58', dept: 'Küche', name: 'Vinyl Handschuhe M (Găng tay)', category: 'Hygiene', unit: 'Karton', soll: 3, current: 3, supplier: 'Selgros' },
            { id: 'f59', dept: 'Küche', name: 'Müllbeutel 60L (Túi rác 60L)', category: 'Hygiene', unit: 'Rolle', soll: 5, current: 5, supplier: 'Selgros' },
            { id: 'f60', dept: 'Küche', name: 'Müllbeutel 120L (Túi rác 120L)', category: 'Hygiene', unit: 'Rolle', soll: 5, current: 5, supplier: 'Selgros' }
        ];

        const DEFAULT_SUPPLIERS = ['Asia Import', 'Selgros', 'Hamberger', 'Boboq', 'Kaufland', 'Sonstige'];

        function App() {
            const [items, setItems] = useState(() => {
                const localSaved = localStorage.getItem('ikura_inventory_excel');
                if (localSaved) {
                    try { return JSON.parse(localSaved); } catch(e){}
                }
                return EXCEL_ITEMS;
            });
            const [loading, setLoading] = useState(true);
            const [isCloudConnected, setIsCloudConnected] = useState(false);
            const [suppliers] = useState(DEFAULT_SUPPLIERS);
            const [adminPin] = useState(() => localStorage.getItem('ikura_admin_pin') || '1234');
            const [isAdmin, setIsAdmin] = useState(false);
            const [activeTab, setActiveTab] = useState('check');
            const [selectedDept, setSelectedDept] = useState('Tất cả');
            const [selectedCategory, setSelectedCategory] = useState('Tất cả');
            const [searchQuery, setSearchQuery] = useState('');
            const [copiedSupplier, setCopiedSupplier] = useState(null);
            const [showPinModal, setShowPinModal] = useState(false);
            const [inputPin, setInputPin] = useState('');
            const [pinError, setPinError] = useState('');

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [formData, setFormData] = useState({ dept: 'Bar', name: '', category: 'Tee & Basis', unit: 'Flasche', soll: 5, supplier: 'Asia Import' });

            useEffect(() => {
                let isMounted = true;
                const fallbackTimeout = setTimeout(() => {
                    if (isMounted && loading) setLoading(false);
                }, 3500);

                if (db) {
                    try {
                        const itemsRef = db.ref('ikura_inventory_items');
                        itemsRef.on('value', (snapshot) => {
                            if (!isMounted) return;
                            clearTimeout(fallbackTimeout);
                            
                            const data = snapshot.val();
                            const localSaved = localStorage.getItem('ikura_inventory_excel');
                            let localItems = null;
                            if (localSaved) {
                                try { localItems = JSON.parse(localSaved); } catch(e){}
                            }

                            if (data && Array.isArray(data) && data.length > 0) {
                                setItems(data);
                                setIsCloudConnected(true);
                            } else {
                                const initialData = (localItems && localItems.length > 0) ? localItems : EXCEL_ITEMS;
                                itemsRef.set(initialData);
                                setItems(initialData);
                                setIsCloudConnected(true);
                            }
                            setLoading(false);
                        }, (error) => {
                            if (isMounted) {
                                clearTimeout(fallbackTimeout);
                                setLoading(false);
                            }
                        });
                    } catch(e) {
                        clearTimeout(fallbackTimeout);
                        if (isMounted) setLoading(false);
                    }
                } else {
                    clearTimeout(fallbackTimeout);
                    setLoading(false);
                }

                return () => {
                    isMounted = false;
                    clearTimeout(fallbackTimeout);
                };
            }, []);

            const saveToCloud = (newItems) => {
                setItems(newItems);
                localStorage.setItem('ikura_inventory_excel', JSON.stringify(newItems));
                if (db && isCloudConnected) {
                    try { db.ref('ikura_inventory_items').set(newItems); } catch(e){}
                }
            };

            const forceUploadLocalToCloud = () => {
                const localSaved = localStorage.getItem('ikura_inventory_excel');
                if (localSaved) {
                    try {
                        const localItems = JSON.parse(localSaved);
                        if (localItems && localItems.length > 0) {
                            if (window.confirm('Bạn có chắc muốn đẩy dữ liệu từ máy này đè lên Cloud không?')) {
                                saveToCloud(localItems);
                                alert('✅ Đã đẩy thành công dữ liệu từ máy này lên Cloud!');
                                return;
                            }
                        }
                    } catch(e){}
                }
                alert('Không tìm thấy dữ liệu cũ trên thiết bị này.');
            };

            const currentCategories = ['Tất cả', ...new Set(items.filter(i => selectedDept === 'Tất cả' || i.dept === selectedDept).map(i => i.category))];

            const handleVerifyPin = (e) => {
                e.preventDefault();
                if (inputPin === adminPin) {
                    setIsAdmin(true);
                    setShowPinModal(false);
                    setInputPin('');
                    setPinError('');
                } else {
                    setPinError('Mã PIN không đúng!');
                }
            };

            const handleTabChange = (tab) => {
                if ((tab === 'order' || tab === 'manage') && !isAdmin) {
                    setShowPinModal(true);
                } else {
                    setActiveTab(tab);
                }
            };

            const updateCurrent = (id, delta) => {
                const updated = items.map(item => {
                    if (item.id === id) {
                        return { ...item, current: Math.max(0, item.current + delta) };
                    }
                    return item;
                });
                saveToCloud(updated);
            };

            const handleSaveItem = (e) => {
                e.preventDefault();
                if (!formData.name.trim()) return;

                let updated = [];
                if (editingItem) {
                    updated = items.map(i => i.id === editingItem.id ? { ...i, ...formData, soll: Number(formData.soll) } : i);
                } else {
                    const newItem = {
                        id: Date.now().toString(),
                        ...formData,
                        soll: Number(formData.soll),
                        current: Number(formData.soll)
                    };
                    updated = [...items, newItem];
                }
                saveToCloud(updated);
                closeModal();
            };

            const deleteItem = (id) => {
                if (window.confirm('Xóa món này khỏi danh mục?')) {
                    const updated = items.filter(i => i.id !== id);
                    saveToCloud(updated);
                }
            };

            const openModal = (item = null) => {
                if (!isAdmin) {
                    setShowPinModal(true);
                    return;
                }
                if (item) {
                    setEditingItem(item);
                    setFormData({ dept: item.dept || 'Bar', name: item.name, category: item.category, unit: item.unit, soll: item.soll, supplier: item.supplier });
                } else {
                    setEditingItem(null);
                    setFormData({ dept: selectedDept === 'Küche' ? 'Küche' : 'Bar', name: '', category: 'Frische Gemüse', unit: 'Kg', soll: 5, supplier: 'Selgros' });
                }
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingItem(null);
            };

            const handleRestockSupplier = (supplierName) => {
                const updated = items.map(item => {
                    const matchDept = selectedDept === 'Tất cả' || item.dept === selectedDept;
                    if (matchDept && item.supplier === supplierName && item.current < item.soll) {
                        return { ...item, current: item.soll };
                    }
                    return item;
                });
                saveToCloud(updated);
            };

            const copyToClipboard = (supplierName, missingItems) => {
                let msg = `Hallo ${supplierName},\n\nhier ist die Bestellung für IKURA Restaurant (Eisleben):\n\n`;
                missingItems.forEach(item => {
                    const need = item.soll - item.current;
                    msg += `• [${item.dept.toUpperCase()}] ${item.name}: ${need} ${item.unit}\n`;
                });
                msg += `\nVielen Dank!\nIKURA Restaurant Eisleben`;

                navigator.clipboard.writeText(msg);
                setCopiedSupplier(supplierName);
                setTimeout(() => setCopiedSupplier(null), 2000);
            };

                const dateStr = new Date().toLocaleDateString('de-DE');
                const element = document.createElement('div');
                element.style.padding = '20px';
                element.style.fontFamily = 'Arial, sans-serif';
                element.style.color = '#1e293b';
                element.style.backgroundColor = '#ffffff';

                let tableRows = missingItems.map((item, idx) => `
                    <tr style="border-bottom: 1px solid #cbd5e1;">
                        <td style="padding: 8px; border: 1px solid #475569; text-align: center; font-weight: bold;">${idx + 1}</td>
                        <td style="padding: 8px; border: 1px solid #475569; text-align: center; font-weight: bold; color: ${item.dept === 'Küche' ? '#d97706' : '#7c3aed'};">${item.dept || 'Bar'}</td>
                        <td style="padding: 8px; border: 1px solid #475569; font-weight: bold; font-size: 13px;">${item.name}</td>
                        <td style="padding: 8px; border: 1px solid #475569; text-align: center; font-size: 14px; font-weight: font-black; color: #dc2626; background-color: #fef2f2;">${item.soll - item.current}</td>
                        <td style="padding: 8px; border: 1px solid #475569; text-align: center; font-weight: 600;">${item.unit}</td>
                    </tr>
                `).join('');

                element.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #10b981; padding-bottom: 12px; margin-bottom: 16px;">
                        <div>
                            <h2 style="margin: 0; font-size: 22px; color: #059669; font-weight: 900; letter-spacing: 1px;">IKURA RESTAURANT</h2>
                            <p style="margin: 4px 0 0 0; font-size: 11px; color: #64748b; font-weight: 600;">Friedensstraße 2, 06295 Lutherstadt Eisleben</p>
                        </div>
                        <div style="text-align: right;">
                            <h3 style="margin: 0; font-size: 16px; font-weight: 800; color: #0f172a;">WENIG BESTELLUNG</h3>
                            <p style="margin: 4px 0 0 0; font-size: 11px; color: #64748b;">Datum: <b>${dateStr}</b></p>
                        </div>
                    </div>

                    <div style="margin-bottom: 16px; background-color: #f8fafc; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #10b981; font-size: 13px;">
                        <p style="margin: 0;"><strong>An Lieferant (Đại lý):</strong> <span style="color: #059669; font-weight: bold; font-size: 14px;">${supplierName}</span></p>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px;">
                        <thead>
                            <tr style="background-color: #0f172a; color: #ffffff;">
                                <th style="padding: 10px 6px; border: 1px solid #0f172a; width: 35px; text-align: center;">Nr.</th>
                                <th style="padding: 10px 6px; border: 1px solid #0f172a; width: 75px; text-align: center;">Abt.</th>
                                <th style="padding: 10px 10px; border: 1px solid #0f172a; text-align: left;">Artikel (Tên mặt hàng)</th>
                                <th style="padding: 10px 6px; border: 1px solid #0f172a; width: 85px; text-align: center;">Menge (Cần)</th>
                                <th style="padding: 10px 6px; border: 1px solid #0f172a; width: 75px; text-align: center;">Einheit</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>

                    <div style="margin-top: 30px; font-size: 11px; color: #64748b; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 12px;">
                        <p style="margin: 0; font-weight: 600;">Vielen Dank für die Zusammenarbeit! | IKURA Restaurant Eisleben</p>
                    </div>
                `;

                const opt = {
                    margin:       8,
                    filename:     `Bestellung_IKURA_${supplierName}_${dateStr.replace(/\./g, '-')}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save();
            };

            const filteredItems = items.filter(i => {
                const matchDept = selectedDept === 'Tất cả' || i.dept === selectedDept;
                const matchCat = selectedCategory === 'Tất cả' || i.category === selectedCategory;
                const matchSearch = i.name.toLowerCase().includes(searchQuery.toLowerCase()) || i.supplier.toLowerCase().includes(searchQuery.toLowerCase());
                return matchDept && matchCat && matchSearch;
            });

            const missingItemsTotal = items.filter(i => (selectedDept === 'Tất cả' || i.dept === selectedDept) && i.current < i.soll);

            if (loading) {
                return (
                    <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center space-y-3">
                        <div className="w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>

                        <div className="flex items-center gap-1.5 shrink-0">

                        </div>
                    </header>

                    {/* BỘ LỌC KHO BAR / BẾP */}

                        <button 
                            onClick={() => { setSelectedDept('Tất cả'); setSelectedCategory('Tất cả'); }} 
                            className={`flex-1 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${selectedDept === 'Tất cả' ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-800/80 text-slate-400'}`}
                        >
                            🌐 Tất Cả
                        </button>
                        <button 
                            onClick={() => { setSelectedDept('Bar'); setSelectedCategory('Tất cả'); }} 
                            className={`flex-1 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${selectedDept === 'Bar' ? 'bg-purple-600 text-white shadow-md' : 'bg-slate-800/80 text-slate-400'}`}
                        >
                            🍷 Kho Bar
                        </button>
                        <button 
                            onClick={() => { setSelectedDept('Küche'); setSelectedCategory('Tất cả'); }} 
                            className={`flex-1 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1 ${selectedDept === 'Küche' ? 'bg-amber-600 text-white shadow-md' : 'bg-slate-800/80 text-slate-400'}`}
                        >
                            🍳 Kho Bếp
                        </button>
                    </div>

                    {/* MAIN CONTAINER */}
                    <main className="w-full max-w-lg mx-auto px-2.5 pt-2.5">
                        
                        {/* TAB 1: KIỂM KHO */}
                        {activeTab === 'check' && (
                            <div className="space-y-2.5 w-full">
                                
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="🔍 Tìm nhanh tên món hoặc đại lý..."
                                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 shadow-inner"
                                />

                                <div className="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar w-full">
                                    {currentCategories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap transition border shrink-0 ${
                                                selectedCategory === cat ? 'bg-emerald-500 text-slate-950 border-emerald-400 shadow' : 'bg-slate-900 text-slate-400 border-slate-800'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid gap-2 w-full">
                                    {filteredItems.map(item => {
                                        const isShort = item.current < item.soll;
                                        const missing = item.soll - item.current;
                                        return (
                                            <div 
                                                key={item.id}
                                                className={`bg-slate-900/90 rounded-2xl p-3 border transition flex items-center justify-between gap-2 shadow-sm w-full ${
                                                    isShort ? 'border-amber-500/60 bg-amber-950/10' : 'border-slate-800/80'
                                                }`}
                                            >
                                                <div className="flex-1 min-w-0 pr-1">
                                                    <div className="flex items-start gap-1.5 mb-1.5">
                                                        <span className={`text-[9px] px-1.5 py-0.5 mt-0.5 rounded font-black uppercase tracking-wider shrink-0 ${item.dept === 'Küche' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-purple-500/20 text-purple-400 border border-purple-500/30'}`}>
                                                            {item.dept || 'Bar'}
                                                        </span>
                                                        <span className="font-bold text-xs text-white leading-tight break-words flex-1">{item.name}</span>
                                                    </div>
                                                    
                                                    <div className="text-[10px] text-slate-400 flex items-center gap-1.5 flex-wrap">
                                                        <span className="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-medium">Đ/vị: {item.unit}</span>
                                                        <span>•</span>
                                                        <span>Soll: <b>{item.soll}</b></span>
                                                        <span>•</span>
                                                        <span className="text-emerald-400 font-semibold">{item.supplier}</span>
                                                    </div>

                                                    {isShort && (
                                                        <div className="mt-1">
                                                            <span className="text-[10px] text-amber-400 font-extrabold bg-amber-500/20 px-1.5 py-0.5 rounded border border-amber-500/30 inline-block">
                                                                ⚠️ Thiếu {missing} {item.unit}
                                                            </span>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 shrink-0">
                                                    <button 
                                                        onClick={() => updateCurrent(item.id, -1)} 
                                                        className="w-11 h-11 rounded-lg bg-slate-800 active:bg-slate-700 text-slate-100 font-black text-xl flex items-center justify-center active:scale-95 transition"
                                                    >
                                                        -
                                                    </button>
                                                    
                                                    <div className="w-8 text-center">
                                                        <span className={`font-black text-base ${isShort ? 'text-amber-400' : 'text-emerald-400'}`}>
                                                            {item.current}
                                                        </span>
                                                    </div>

                                                    <button 
                                                        onClick={() => updateCurrent(item.id, 1)} 
                                                        className="w-11 h-11 rounded-lg bg-slate-800 active:bg-slate-700 text-slate-100 font-black text-xl flex items-center justify-center active:scale-95 transition"
                                                    >
                                                        +
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: ĐẶT HÀNG (ADMIN ONLY) */}
                        {activeTab === 'order' && isAdmin && (
                            <div className="space-y-3 w-full">
                                <div className="bg-slate-900 rounded-2xl p-3 border border-slate-800 flex items-center justify-between text-xs shadow-sm w-full">
                                    <div>
                                        <h2 className="font-bold text-white text-xs">Tổng hợp đơn đặt hàng ({selectedDept})</h2>
                                        <p className="text-[10px] text-slate-400">Tự động gom món thiếu theo Đại lý</p>
                                    </div>
                                    <span className="bg-amber-500/20 text-amber-400 font-black px-2.5 py-1 rounded-xl border border-amber-500/30 text-xs shrink-0">
                                        {missingItemsTotal.length} món
                                    </span>
                                </div>

                                {suppliers.map(supplier => {
                                    const supplierMissing = items.filter(i => (selectedDept === 'Tất cả' || i.dept === selectedDept) && i.supplier === supplier && i.current < i.soll);
                                    if (supplierMissing.length === 0) return null;

                                    return (
                                        <div key={supplier} className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden text-xs shadow-md w-full">
                                            <div className="bg-slate-800/80 px-3.5 py-2.5 border-b border-slate-800 flex items-center justify-between font-bold">
                                                <span className="text-emerald-400 text-xs">{supplier}</span>
                                                <span className="text-slate-400 text-[10px] font-normal shrink-0">{supplierMissing.length} mặt hàng</span>
                                            </div>

                                            <div className="p-3 space-y-2 w-full">
                                                {supplierMissing.map(item => (
                                                    <div key={item.id} className="flex justify-between items-start gap-2 py-1 border-b border-slate-800/50 last:border-0">
                                                        <span className="text-slate-200 font-medium text-xs break-words flex-1"><b className="text-slate-500">[{item.dept}]</b> {item.name}</span>
                                                        <span className="font-bold text-amber-400 text-xs bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20 shrink-0 mt-0.5">
                                                            Cần: {item.soll - item.current} {item.unit}
                                                        </span>
                                                    </div>
                                                ))}

                                                {/* NÚT THAO TÁC CÓ THÊM XUẤT PDF */}
                                                <div className="pt-2 flex gap-1.5 flex-wrap">
                                                    <button onClick={() => copyToClipboard(supplier, supplierMissing)} className="flex-1 bg-emerald-600 active:bg-emerald-700 text-white font-bold py-2 rounded-xl text-[11px] shadow transition min-w-[120px]">
                                                        {copiedSupplier === supplier ? '✅ Đã copy!' : '📋 Copy Text'}
                                                    </button>
                                                    <button onClick={() => exportSupplierPDF(supplier, supplierMissing)} className="flex-1 bg-blue-600 active:bg-blue-700 text-white font-bold py-2 rounded-xl text-[11px] shadow transition min-w-[110px]">
                                                        📄 Xuất PDF
                                                    </button>
                                                    <button onClick={() => handleRestockSupplier(supplier)} className="bg-slate-800 active:bg-slate-700 text-slate-300 font-medium px-2.5 py-2 rounded-xl text-[11px] transition shrink-0">
                                                        Đã nhập
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* TAB 3: DANH MỤC & CÀI ĐẶT (ADMIN ONLY) */}
                        {activeTab === 'manage' && isAdmin && (
                            <div className="space-y-3 w-full">
                                <div className="bg-amber-950/20 border border-amber-500/30 p-3 rounded-2xl flex items-center justify-between gap-2 text-xs">
                                    <div>
                                        <p className="font-bold text-amber-400">Khôi phục dữ liệu từ máy này?</p>
                                        <p className="text-[10px] text-slate-400 mt-0.5">Đẩy dữ liệu đã chỉnh sửa từ thiết bị này lên Cloud</p>
                                    </div>
                                    <button onClick={forceUploadLocalToCloud} className="bg-amber-600 active:bg-amber-700 text-white font-bold px-3 py-2 rounded-xl shrink-0 text-xs shadow">
                                        ⬆️ Đẩy lên Cloud
                                    </button>
                                </div>

                                <div className="bg-slate-900 rounded-2xl border border-slate-800 divide-y divide-slate-800/80 text-xs shadow-md w-full">
                                    {filteredItems.map(item => (
                                        <div key={item.id} className="p-3 flex items-center justify-between w-full overflow-hidden">
                                            <div className="min-w-0 flex-1 pr-2">
                                                <p className="font-bold text-white text-xs break-words">[{item.dept || 'Bar'}] {item.name}</p>
                                                <p className="text-[10px] text-slate-400 mt-0.5 break-words">{item.category} • Soll: {item.soll} {item.unit} • {item.supplier}</p>
                                            </div>
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={() => openModal(item)} className="p-2 text-slate-400 hover:text-emerald-400 active:scale-95">✏️</button>
                                                <button onClick={() => deleteItem(item.id)} className="p-2 text-slate-400 hover:text-rose-400 active:scale-95">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* BOTTOM MOBILE NAVIGATION BAR */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-3 py-2 z-40 shadow-2xl pb-safe w-full">
                        <div className="max-w-md mx-auto flex justify-around text-[11px] font-bold">
                            <button 
                                onClick={() => handleTabChange('check')} 
                                className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab === 'check' ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-400'}`}
                            >
                                <span className="text-base mb-0.5">📋</span>
                                <span>1. Kiểm Kho</span>
                            </button>
                            <button 
                                onClick={() => handleTabChange('order')} 
                                className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab === 'order' ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-400'}`}
                            >
                                <span className="text-base mb-0.5">🛒</span>
                                <span>2. Đặt Hàng {!isAdmin && '🔒'}</span>
                            </button>
                            <button 
                                onClick={() => handleTabChange('manage')} 
                                className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab === 'manage' ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-400'}`}
                            >
                                <span className="text-base mb-0.5">⚙️</span>
                                <span>3. Danh Mục {!isAdmin && '🔒'}</span>
                            </button>
                        </div>
                    </nav>

                    {/* PIN MODAL */}
                    {showPinModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-xs p-5 space-y-4 text-center shadow-2xl">
                                <h3 className="font-bold text-sm text-white">🔒 Mã PIN Admin</h3>
                                <form onSubmit={handleVerifyPin} className="space-y-3">
                                    <input type="password" maxLength="6" value={inputPin} onChange={e => setInputPin(e.target.value)} placeholder="••••" className="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 text-center text-xl text-white outline-none focus:border-emerald-500" autoFocus />
                                    {pinError && <p className="text-xs text-rose-400 font-semibold">{pinError}</p>}
                                    <div className="flex gap-2 text-xs">
                                        <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold">Hủy</button>
                                        <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow">Mở Khóa</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ADD / EDIT ITEM */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-4 space-y-3 text-xs shadow-2xl overflow-y-auto max-h-[90vh]">
                                <h3 className="font-bold text-sm text-white">{editingItem ? 'Sửa thông tin món' : 'Thêm món mới'}</h3>
                                <form onSubmit={handleSaveItem} className="space-y-2.5">
                                    <div>
                                        <label className="block text-slate-400 mb-1">Bộ phận (Abteilung)</label>
                                        <select value={formData.dept} onChange={e => setFormData({ ...formData, dept: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                                            <option value="Bar">🍷 Bar / Đồ Uống</option>
                                            <option value="Küche">🍳 Küche / Bếp</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-400 mb-1">Tên món nguyên liệu</label>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-400 mb-1">Danh mục</label>
                                            <select value={formData.category} onChange={e => setFormData({ ...formData, category: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                                                {currentCategories.filter(c => c !== 'Tất cả').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">Đơn vị tính</label>
                                            <input type="text" required value={formData.unit} onChange={e => setFormData({ ...formData, unit: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-400 mb-1">Mức đầy kho (Soll)</label>
                                            <input type="number" min="1" required value={formData.soll} onChange={e => setFormData({ ...formData, soll: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">Nhà cung cấp</label>
                                            <select value={formData.supplier} onChange={e => setFormData({ ...formData, supplier: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                                                {suppliers.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2 flex gap-2">
                                        <button type="button" onClick={closeModal} className="flex-1 bg-slate-800 text-slate-300 py-2.5 rounded-xl font-bold">Hủy</button>
                                        <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow">Lưu lại</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
