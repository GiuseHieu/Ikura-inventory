            { id: 'f56', dept: 'Küche', name: 'Tragetaschen (Túi mang đi)', category: 'Verpackung Bếp', unit: 'Karton', soll: 3, current: 3, supplier: 'Asia Import' },

            { id: 'f57', dept: 'Küche', name: 'FIT Spülmittel (Nước rửa chén)', category: 'Hygiene', unit: 'Flasche', soll: 4, current: 4, supplier: 'Selgros' },
            { id: 'f58', dept: 'Küche', name: 'Vinyl Handschuhe M (Găng tay vinyl)', category: 'Hygiene', unit: 'Karton', soll: 3, current: 3, supplier: 'Selgros' },
            { id: 'f59', dept: 'Küche', name: 'Müllbeutel 60L (Túi rác 60L)', category: 'Hygiene', unit: 'Rolle', soll: 5, current: 5, supplier: 'Selgros' },
            { id: 'f60', dept: 'Küche', name: 'Müllbeutel 120L (Túi rác 120L)', category: 'Hygiene', unit: 'Rolle', soll: 5, current: 5, supplier: 'Selgros' }
        ];

        const DEFAULT_SUPPLIERS = ['Asia Import', 'Selgros', 'Hamberger', 'Boboq', 'Kaufland', 'Sonstige'];

        function App() {
            // TỰ ĐỘNG ĐỒNG BỘ NGUYÊN LIỆU EXCEL
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('ikura_inventory_excel');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { return EXCEL_ITEMS; }
                }
                return EXCEL_ITEMS;
            });

            const [suppliers] = useState(DEFAULT_SUPPLIERS);
            const [adminPin] = useState(() => localStorage.getItem('ikura_admin_pin') || '1234');
            const [isAdmin, setIsAdmin] = useState(false);
            const [activeTab, setActiveTab] = useState('check');
            const [selectedDept, setSelectedDept] = useState('Tất cả'); // 'Tất cả' | 'Bar' | 'Küche'
            const [selectedCategory, setSelectedCategory] = useState('Tất cả');
            const [searchQuery, setSearchQuery] = useState('');
            const [copiedSupplier, setCopiedSupplier] = useState(null);
            const [showPinModal, setShowPinModal] = useState(false);
            const [inputPin, setInputPin] = useState('');
            const [pinError, setPinError] = useState('');

            // Modal state
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [formData, setFormData] = useState({ dept: 'Bar', name: '', category: 'Tee & Basis', unit: 'Flasche', soll: 5, supplier: 'Asia Import' });

            useEffect(() => {
                localStorage.setItem('ikura_inventory_excel', JSON.stringify(items));
            }, [items]);

            // Lấy danh sách Categories động từ Items
            const currentCategories = ['Tất cả', ...new Set(items.filter(i => selectedDept === 'Tất cả' || i.dept === selectedDept).map(i => i.category))];

            const handleVerifyPin = (e) => {
                e.preventDefault();
                if (inputPin === adminPin) {
                    setIsAdmin(true);
                    setShowPinModal(false);
                    setInputPin('');
                    setPinError('');
                } else {
                    setPinError('Mã PIN không đúng!');
                }
            };

            const handleTabChange = (tab) => {
                if ((tab === 'order' || tab === 'manage') && !isAdmin) {
                    setShowPinModal(true);
                } else {
                    setActiveTab(tab);
                }
            };

            const updateCurrent = (id, delta) => {
                setItems(prev => prev.map(item => {
                    if (item.id === id) {
                        return { ...item, current: Math.max(0, item.current + delta) };
                    }
                    return item;
                }));
            };

            const handleSaveItem = (e) => {
                e.preventDefault();
                if (!formData.name.trim()) return;

                if (editingItem) {
                    setItems(prev => prev.map(i => i.id === editingItem.id ? { ...i, ...formData, soll: Number(formData.soll) } : i));
                } else {
                    const newItem = {
                        id: Date.now().toString(),
                        ...formData,
                        soll: Number(formData.soll),
                        current: Number(formData.soll)
                    };
                    setItems(prev => [...prev, newItem]);
                }
                closeModal();
            };

            const deleteItem = (id) => {
                if (window.confirm('Bạn có chắc muốn xóa món này khỏi danh mục?')) {
                    setItems(prev => prev.filter(i => i.id !== id));
                }
            };

            const openModal = (item = null) => {
                if (!isAdmin) {
                    setShowPinModal(true);
                    return;
                }
                if (item) {
                    setEditingItem(item);
                    setFormData({ dept: item.dept || 'Bar', name: item.name, category: item.category, unit: item.unit, soll: item.soll, supplier: item.supplier });
                } else {
                    setEditingItem(null);
                    setFormData({ dept: selectedDept === 'Küche' ? 'Küche' : 'Bar', name: '', category: 'Frische Gemüse', unit: 'Kg', soll: 5, supplier: 'Selgros' });
                }
                setIsModalOpen(true);
            };

            const closeModal = () => {
                setIsModalOpen(false);
                setEditingItem(null);
            };

            const handleRestockSupplier = (supplierName) => {
                setItems(prev => prev.map(item => {
                    const matchDept = selectedDept === 'Tất cả' || item.dept === selectedDept;
                    if (matchDept && item.supplier === supplierName && item.current < item.soll) {
                        return { ...item, current: item.soll };
                    }
                    return item;
                }));
            };

            const copyToClipboard = (supplierName, missingItems) => {
                let msg = `Hallo ${supplierName},\n\nhier ist die Bestellung für IKURA Restaurant (Eisleben):\n\n`;
                missingItems.forEach(item => {
                    const need = item.soll - item.current;
                    msg += `• [${item.dept.toUpperCase()}] ${item.name}: ${need} ${item.unit}\n`;
                });
                msg += `\nVielen Dank!\nIKURA Restaurant Eisleben`;

                navigator.clipboard.writeText(msg);
                setCopiedSupplier(supplierName);
                setTimeout(() => setCopiedSupplier(null), 2000);
            };

            const filteredItems = items.filter(i => {
                const matchDept = selectedDept === 'Tất cả' || i.dept === selectedDept;
                const matchCat = selectedCategory === 'Tất cả' || i.category === selectedCategory;
                const matchSearch = i.name.toLowerCase().includes(searchQuery.toLowerCase()) || i.supplier.toLowerCase().includes(searchQuery.toLowerCase());
                return matchDept && matchCat && matchSearch;
            });

            const missingItemsTotal = items.filter(i => (selectedDept === 'Tất cả' || i.dept === selectedDept) && i.current < i.soll);

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 font-sans pb-28">
                    {/* Header */}
                    <header className="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 px-4 py-3 shadow-md flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                            <div className="bg-emerald-500 text-slate-950 font-extrabold px-2 py-1 rounded-lg text-xs tracking-wider">
                                IKURA
                            </div>
                            <div>
                                <h1 className="font-bold text-sm leading-tight">Quản Lý Kho Hàng</h1>
                                <p className="text-[10px] text-slate-400">Eisleben</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {isAdmin ? (
                                <button onClick={() => setIsAdmin(false)} className="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded-lg text-xs font-semibold">
                                    👑 Admin Active
                                </button>
                            ) : (
                                <button onClick={() => setShowPinModal(true)} className="bg-slate-700 hover:bg-slate-600 text-slate-300 px-2 py-1 rounded-lg text-xs font-semibold">
                                    🔒 Mở Admin
                                </button>
                            )}

                            {isAdmin && (
                                <button onClick={() => openModal()} className="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-1 rounded-lg text-xs font-medium">
                                    + Thêm món
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Bộ Lọc Bộ Phận (Abteilung) */}
                    <div className="bg-slate-800/80 p-2 border-b border-slate-700 flex justify-center gap-2">
                        <button 
                            onClick={() => { setSelectedDept('Tất cả'); setSelectedCategory('Tất cả'); }} 
                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${selectedDept === 'Tất cả' ? 'bg-slate-700 text-white shadow' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            🌐 Tất Cả
                        </button>
                        <button 
                            onClick={() => { setSelectedDept('Bar'); setSelectedCategory('Tất cả'); }} 
                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${selectedDept === 'Bar' ? 'bg-purple-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            🍷 Kho Bar
                        </button>
                        <button 
                            onClick={() => { setSelectedDept('Küche'); setSelectedCategory('Tất cả'); }} 
                            className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition ${selectedDept === 'Küche' ? 'bg-amber-600 text-white shadow' : 'text-slate-400 hover:bg-slate-800'}`}
                        >
                            🍳 Kho Bếp
                        </button>
                    </div>

                    {/* Main Content */}
                    <main className="max-w-3xl mx-auto px-4 py-3">
                        {/* TAB 1: KIỂM KHO */}
                        {activeTab === 'check' && (
                            <div className="space-y-3">
                                {/* Search Bar */}
                                <input 
                                    type="text" 
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                    placeholder="🔍 Tìm tên món hoặc đại lý..."
                                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                                />

                                {/* Category Filters */}
                                <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                                    {currentCategories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3 py-1 rounded-full text-[11px] font-medium whitespace-nowrap transition ${
                                                selectedCategory === cat ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-300'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                {/* Item List */}
                                <div className="grid gap-2">
                                    {filteredItems.map(item => {
                                        const isShort = item.current < item.soll;
                                        const missing = item.soll - item.current;
                                        return (
                                            <div 
                                                key={item.id}
                                                className={`bg-slate-800 rounded-xl p-3 border transition flex items-center justify-between gap-2 ${
                                                    isShort ? 'border-amber-500/50 bg-slate-800/90' : 'border-slate-700/60'
                                                }`}
                                            >
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center gap-1.5">
                                                        <span className={`text-[9px] px-1.5 py-0.2 rounded font-bold uppercase ${item.dept === 'Küche' ? 'bg-amber-500/20 text-amber-400' : 'bg-purple-500/20 text-purple-400'}`}>
                                                            {item.dept || 'Bar'}
                                                        </span>
                                                        <span className="font-semibold text-xs text-white truncate">{item.name}</span>
                                                        {isShort && (
                                                            <span className="bg-amber-500/20 text-amber-400 text-[10px] px-1.5 py-0.5 rounded font-bold">
                                                                Thiếu {missing}
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="text-[11px] text-slate-400 mt-1 flex items-center gap-1.5">
                                                        <span>Đ/vị: {item.unit}</span>
                                                        <span>•</span>
                                                        <span>Đầy: {item.soll}</span>
                                                        <span>•</span>
                                                        <span className="text-emerald-400">{item.supplier}</span>
                                                    </div>
                                                </div>

                                                {/* Counter Buttons */}
                                                <div className="flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-700">
                                                    <button onClick={() => updateCurrent(item.id, -1)} className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-lg flex items-center justify-center active:scale-95 transition">-</button>
                                                    <span className={`w-7 text-center font-extrabold text-sm ${isShort ? 'text-amber-400' : 'text-emerald-400'}`}>{item.current}</span>
                                                    <button onClick={() => updateCurrent(item.id, 1)} className="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-lg flex items-center justify-center active:scale-95 transition">+</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: ĐẶT HÀNG (ADMIN) */}
                        {activeTab === 'order' && isAdmin && (
                            <div className="space-y-3">
                                <div className="bg-slate-800 rounded-xl p-3 border border-slate-700 flex items-center justify-between text-xs">
                                    <div>
                                        <h2 className="font-bold text-white">Tổng hợp đơn ({selectedDept})</h2>
                                        <p className="text-[10px] text-slate-400">Gom theo Đại lý</p>
                                    </div>
                                    <span className="bg-amber-500/20 text-amber-400 font-bold px-2.5 py-1 rounded-lg border border-amber-500/30">
                                        {missingItemsTotal.length} món thiếu
                                    </span>
                                </div>

                                {suppliers.map(supplier => {
                                    const supplierMissing = items.filter(i => (selectedDept === 'Tất cả' || i.dept === selectedDept) && i.supplier === supplier && i.current < i.soll);
                                    if (supplierMissing.length === 0) return null;

                                    return (
                                        <div key={supplier} className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden text-xs">
                                            <div className="bg-slate-700/50 px-3 py-2 border-b border-slate-700 flex items-center justify-between font-bold">
                                                <span className="text-emerald-400">{supplier}</span>
                                                <span className="text-slate-400 font-normal">{supplierMissing.length} món</span>
                                            </div>

                                            <div className="p-3 space-y-1.5">
                                                {supplierMissing.map(item => (
                                                    <div key={item.id} className="flex justify-between py-1 border-b border-slate-700/40 last:border-0">
                                                        <span><b className="text-slate-400">[{item.dept}]</b> {item.name}</span>
                                                        <span className="font-bold text-amber-400">Cần: {item.soll - item.current} {item.unit}</span>
                                                    </div>
                                                ))}

                                                <div className="pt-2 flex gap-2">
                                                    <button onClick={() => copyToClipboard(supplier, supplierMissing)} className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-lg">
                                                        {copiedSupplier === supplier ? '✅ Đã chép!' : '📋 Copy WhatsApp (DE)'}
                                                    </button>
                                                    <button onClick={() => handleRestockSupplier(supplier)} className="bg-slate-700 text-slate-200 px-3 py-2 rounded-lg">
                                                        Đã nhập kho
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* TAB 3: DANH MỤC & CÀI ĐẶT (ADMIN) */}
                        {activeTab === 'manage' && isAdmin && (
                            <div className="space-y-3">
                                <div className="bg-slate-800 rounded-xl border border-slate-700 divide-y divide-slate-700 text-xs">
                                    {filteredItems.map(item => (
                                        <div key={item.id} className="p-2.5 flex items-center justify-between">
                                            <div>
                                                <p className="font-semibold text-white">[{item.dept || 'Bar'}] {item.name}</p>
                                                <p className="text-[10px] text-slate-400">{item.category} • Soll: {item.soll} {item.unit} • {item.supplier}</p>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => openModal(item)} className="p-1.5 text-slate-400 hover:text-emerald-400">✏️</button>
                                                <button onClick={() => deleteItem(item.id)} className="p-1.5 text-slate-400 hover:text-rose-400">🗑️</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 px-4 py-2 z-30">
                        <div className="max-w-md mx-auto flex justify-around text-xs font-medium">
                            <button onClick={() => handleTabChange('check')} className={`flex flex-col items-center ${activeTab === 'check' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>📋 1. Kiểm Kho</button>
                            <button onClick={() => handleTabChange('order')} className={`flex flex-col items-center ${activeTab === 'order' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>🛒 2. Đặt Hàng {!isAdmin && '🔒'}</button>
                            <button onClick={() => handleTabChange('manage')} className={`flex flex-col items-center ${activeTab === 'manage' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}>⚙️ 3. Danh Mục {!isAdmin && '🔒'}</button>
                        </div>
                    </nav>

                    {/* PIN MODAL */}
                    {showPinModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-5 space-y-4 text-center">
                                <h3 className="font-bold text-sm text-white">🔒 Mã PIN Admin</h3>
                                <form onSubmit={handleVerifyPin} className="space-y-3">
                                    <input type="password" maxLength="6" value={inputPin} onChange={e => setInputPin(e.target.value)} placeholder="••••" className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-center text-lg text-white outline-none" autoFocus />
                                    {pinError && <p className="text-xs text-rose-400">{pinError}</p>}
                                    <div className="flex gap-2 text-xs">
                                        <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 bg-slate-700 text-slate-300 py-2 rounded-xl">Hủy</button>
                                        <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-xl">Mở Khóa</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL ADD / EDIT ITEM */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-4 space-y-3 text-xs">
                                <h3 className="font-bold text-sm text-white">{editingItem ? 'Sửa thông tin món' : 'Thêm món mới'}</h3>
                                <form onSubmit={handleSaveItem} className="space-y-2.5">
                                    <div>
                                        <label className="block text-slate-400 mb-1">Bộ phận (Abteilung)</label>
                                        <select value={formData.dept} onChange={e => setFormData({ ...formData, dept: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                                            <option value="Bar">🍷 Bar / Đồ Uống</option>
                                            <option value="Küche">🍳 Küche / Bếp</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-400 mb-1">Tên món nguyên liệu</label>
                                        <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-400 mb-1">Danh mục</label>
                                            <select value={formData.category} onChange={e => setFormData({ ...formData, category: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                                                {currentCategories.filter(c => c !== 'Tất cả').map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">Đơn vị tính</label>
                                            <input type="text" required value={formData.unit} onChange={e => setFormData({ ...formData, unit: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-400 mb-1">Mức đầy kho (Soll)</label>
                                            <input type="number" min="1" required value={formData.soll} onChange={e => setFormData({ ...formData, soll: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white" />
                                        </div>
                                        <div>
                                            <label className="block text-slate-400 mb-1">Nhà cung cấp</label>
                                            <select value={formData.supplier} onChange={e => setFormData({ ...formData, supplier: e.target.value })} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white">
                                                {suppliers.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div className="pt-2 flex gap-2">
                                        <button type="button" onClick={closeModal} className="flex-1 bg-slate-700 text-slate-300 py-2 rounded-lg">Hủy</button>
                                        <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-lg">Lưu lại</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
